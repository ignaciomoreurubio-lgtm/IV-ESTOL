<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planificador de equipo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e2e5ec;--ac:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.del{color:#d33}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar b{flex:1;text-align:center;min-width:140px;text-transform:capitalize}
.scroll{overflow-x:auto}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:4px;min-width:640px}
.dh{font-size:12px;color:var(--mu);text-align:center;text-transform:uppercase}
.cell{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:92px;padding:4px;cursor:pointer}
.cell.out{opacity:.45}.cell.today{border-color:var(--ac);border-width:2px}
.cell .n{font-size:12px;color:var(--mu)}
.chip{display:block;font-size:11.5px;color:#fff;border-radius:4px;padding:1px 5px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mu)}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--ac);border-width:2px}
.day h3{margin:0;font-size:13px;text-transform:capitalize}
.ev{border-left:4px solid;border-radius:6px;background:var(--bg);padding:5px 7px;cursor:pointer}
.ev small{color:var(--mu);display:block}
.pp{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.av{display:inline-block;font-size:11px;color:#fff;border-radius:10px;padding:0 7px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;max-width:520px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.dot{width:14px;height:14px;border-radius:50%}
input,select,textarea{font:inherit;width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:4px;margin:0;font-size:13px;color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:3px 9px}
.chk input{width:auto}
.act{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.mu{color:var(--mu);font-size:13px}
.warn{background:#fdecea;color:#a12622;border:1px solid #f3b7b3;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.tl{border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.trow{display:flex;border-bottom:1px solid var(--bd)}
.lab{position:sticky;left:0;z-index:3;background:var(--card);width:130px;flex:none;padding:4px 6px;border-right:1px solid var(--bd);font-size:13px}
.lab small{display:block;color:var(--mu);font-size:11px}
.trk{position:relative;flex:1;background-image:repeating-linear-gradient(to right,var(--bd) 0,var(--bd) 1px,transparent 1px,transparent calc(100%/var(--n)))}
.hd{display:flex;background-image:none}.hd span{flex:1;text-align:center;font-size:10px;color:var(--mu)}
.tb{position:absolute;z-index:2;height:20px;color:#fff;font-size:11px;border-radius:4px;padding:1px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.tb.x{outline:2px solid #e02424;outline-offset:-1px}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);opacity:.6;z-index:1}
.pre{display:flex;flex-wrap:wrap;gap:5px;max-height:100px;overflow:auto;margin-top:6px}
.pb{font-size:12px;padding:2px 9px;border-radius:14px}
.rin{font-size:12px;padding:4px 6px;width:150px}

html,body{background:var(--bg)}
body{font-family:"Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;background:var(--logo) center/min(78vw,560px) no-repeat;opacity:.045;pointer-events:none}
.wrap{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid var(--ac)}
.logo{width:72px;height:52px;flex:none;background:var(--logo) center/contain no-repeat}
.ttl{font-size:21px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.1}
.sub,#hdate,.cell .n,.dh,.hd span,.ev small,.warn,.more{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sub{font-size:11px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-top:3px}
#hdate{margin-left:auto;font-size:12px;color:var(--mu);text-align:right;letter-spacing:.08em}
button{border-radius:3px;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
button:hover{border-color:var(--ac)}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.tabs button{font-weight:700}
.cell,.day,.card,.tl,dialog,input,select,textarea{border-radius:3px}
.day h3{text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mu);border-bottom:1px solid var(--bd);padding-bottom:4px}
.ev{border-radius:2px;background:#1a1f1c}
.tb,.chip,.av{border-radius:2px}
.lab{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}

.tb.x{outline:2px solid #ffb400}

label{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.chk label{text-transform:none;letter-spacing:0;font-size:13px}
</style></head><body><div class="wrap">
<div class="top"><div class="logo" role="img" aria-label="Escudo"></div><div><div class="ttl">Planificador</div><div class="sub">Actividades · Personal · Calendario</div></div><div id="hdate"></div></div>
<div class="tabs" id="tabs"></div>
<div id="alert"></div>
<div id="main"></div>
</div>
<dialog id="dlg"></dialog>
<script>
const PRE=['TIRO','CQB','TP','BUCEO O2','BUCEO AIRE','CALOP','PREPARACION','MANTENIMIENTOS','CARGA','FR','RAPPEL','SALTOS APM','SALTOS APA','SALTOS APM Y APA','SALTO AL AGUA','REPASO SOP','AFM','MARCHA','PISCINA','ESTOLEX','SUPO','CIS'];
const OFF=['festivo','libre','vacaciones'];
const TYPES={evento:['Evento','#2f6fed'],viaje:['Viaje','#d97706'],actividad:['Actividad','#22a06b'],festivo:['Festivo','#8e44ad'],libre:['Día libre','#5f6b7a'],vacaciones:['Vacaciones','#0e9aa7']};
const COL=['#2f6fed','#e0533d','#22a06b','#b8860b','#8e44ad','#0e9aa7','#d6336c','#5f6b7a'];
let S={team:[],events:[],presets:[...PRE]},view='month',cur=new Date(),ready=false,db=null;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=(d,o)=>d.toLocaleDateString('es-ES',o);
const onDay=k=>S.events.filter(e=>e.start<=k&&(e.end||e.start)>=k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const person=id=>S.team.find(p=>p.id===id);
const people=e=>isOff(e)&&!(e.people||[]).length?'<div class="pp"><span class="mu">Todo el equipo</span></div>':'<div class="pp">'+(e.people||[]).map(person).filter(Boolean).map(p=>`<span class="av" style="background:${p.color}">${esc(p.name)}</span>`).join('')+'</div>';

let tl={mode:'tl',r:1},B=new Set();
const isOff=e=>OFF.includes(e.type);
const who=e=>isOff(e)&&!(e.people||[]).length?S.team.map(p=>p.id):(e.people||[]);
const optT=(k,c)=>`<option value="${k}" ${c===k?'selected':''}>${TYPES[k][0]}</option>`;
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3);
function clash(a,b){
  if(a.start>(b.end||b.start)||b.start>(a.end||a.start))return false;
  const one=a.start===(a.end||a.start)&&b.start===(b.end||b.start);
  if(isOff(a)&&isOff(b))return false;
  if(isOff(a)||isOff(b)||!one||!a.time||!b.time)return true;
  const as=toMin(a.time),ae=a.time2?toMin(a.time2):as+60,bs=toMin(b.time),be=b.time2?toMin(b.time2):bs+60;
  return as<be&&bs<ae;
}
function clashes(e){
  const r=[];
  who(e).forEach(id=>{const p=person(id);if(p)S.events.forEach(o=>{if(o.id!==e.id&&who(o).includes(id)&&clash(e,o))r.push({p,o})})});
  return r;
}
const hasClash=(e,pid)=>clashes(e).some(c=>c.p.id===pid);
const tm=e=>e.time?e.time+(e.time2?'–'+e.time2:''):'';
let timer;
function save(){
  if(!ready)return;
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    const data=JSON.parse(JSON.stringify(S));
    try{localStorage.setItem('planner',JSON.stringify(data))}catch(e){}
    try{if(db)await db.doc('planner/state').set(data)}catch(e){console.error(e)}
  },400);
}
async function init(){
  render();
  try{if(window.claude)db=await claude.use('db')}catch(e){}
  try{
    if(db){const s=await db.doc('planner/state').get();if(s.exists)S=JSON.parse(JSON.stringify(s.data()))}
    else{const l=localStorage.getItem('planner');if(l)S=JSON.parse(l)}
  }catch(e){}
  S.team=S.team||[];S.events=S.events||[];S.presets=S.presets||[...PRE];
  ready=true;render();
}

function render(){
  $('#hdate').textContent=fmt(new Date(),{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).replace(/\./g,'').toUpperCase();
  B=new Set();S.events.forEach(e=>{if(clashes(e).length)B.add(e.id)});
  $('#alert').innerHTML=B.size?`<div class="warn">⚠️ ${B.size} actividades tienen a una misma persona en dos sitios a la vez (marcadas con ⚠️).</div>`:'';
  $('#tabs').innerHTML=[['month','Largo plazo'],['week','Semana'],['team','Equipo']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('');
  $('#main').innerHTML=view==='month'?sub()+(tl.mode==='tl'?timeline():month()):view==='week'?week():team();
}
function nav(step){return `<div class="bar"><button onclick="go(-1)">‹</button><b>${step}</b><button onclick="go(1)">›</button><button onclick="cur=new Date();render()">Hoy</button></div>`}
function go(n){if(view==='month')cur=new Date(cur.getFullYear(),cur.getMonth()+n*(tl.mode==='tl'?tl.r:1),1);else cur=add(cur,7*n);render()}
function sub(){return `<div class="tabs"><button class="${tl.mode==='tl'?'on':''}" onclick="tl.mode='tl';render()">Por persona</button><button class="${tl.mode==='cal'?'on':''}" onclick="tl.mode='cal';render()">Calendario</button>${tl.mode==='tl'?[1,3].map(n=>`<button class="${tl.r===n?'on':''}" onclick="tl.r=${n};render()">${n===1?'1 mes':'3 meses'}</button>`).join(''):''}</div>`}

function month(){
  const y=cur.getFullYear(),m=cur.getMonth(),start=monday(new Date(y,m,1)),today=iso(new Date());
  let h=nav(fmt(cur,{month:'long',year:'numeric'}))+'<div class="scroll"><div class="mgrid">';
  ['lun','mar','mié','jue','vie','sáb','dom'].forEach(d=>h+=`<div class="dh">${d}</div>`);
  for(let i=0;i<42;i++){
    const d=add(start,i),k=iso(d),ev=onDay(k);
    if(i>=35&&d.getMonth()!==m)break;
    h+=`<div class="cell ${d.getMonth()!==m?'out':''} ${k===today?'today':''}" onclick="edit(null,'${k}')"><div class="n">${d.getDate()}</div>`;
    ev.slice(0,3).forEach(e=>h+=`<span class="chip" style="background:${TYPES[e.type][1]}" onclick="event.stopPropagation();edit('${e.id}')">${esc(e.title)}</span>`);
    if(ev.length>3)h+=`<span class="more">+${ev.length-3} más</span>`;
    h+='</div>';
  }
  return h+'</div></div><p class="mu">Toca un día para añadir; toca un evento para editarlo. Los viajes y eventos de varios días se repiten en cada día que abarcan.</p>';
}
function timeline(){
  const s=new Date(cur.getFullYear(),cur.getMonth(),1),e=new Date(s.getFullYear(),s.getMonth()+tl.r,0),N=Math.round((e-s)/864e5)+1;
  const base=new Date(iso(s)+'T12:00'),idx=k=>Math.round((new Date(k+'T12:00')-base)/864e5),k0=iso(s),k1=iso(e),today=idx(iso(new Date()));
  const w=N*(tl.r>1?18:30);
  let h=nav(tl.r>1?fmt(s,{month:'short'})+' – '+fmt(e,{month:'short',year:'numeric'}):fmt(s,{month:'long',year:'numeric'}))+`<div class="scroll"><div class="tl" style="min-width:${130+w}px"><div class="trow"><div class="lab"></div><div class="trk hd" style="--n:${N}">`;
  for(let i=0;i<N;i++){const d=add(s,i),n=d.getDate();h+=`<span>${tl.r===1||n%7===1?(n===1&&tl.r>1?fmt(d,{month:'short'}):n):''}</span>`}
  h+='</div></div>';
  const rows=S.team.map(p=>({id:p.id,name:p.name,sub:p.role,evs:S.events.filter(x=>who(x).includes(p.id))}));
  rows.push({id:'',name:'Sin asignar',sub:'',evs:S.events.filter(x=>!isOff(x)&&!(x.people||[]).length)});
  rows.forEach(r=>{
    const L=[],ln=r.evs.filter(x=>x.start<=k1&&(x.end||x.start)>=k0).sort((a,b)=>a.start.localeCompare(b.start)).map(x=>{let i=L.findIndex(v=>v<x.start);if(i<0)i=L.length;L[i]=x.end||x.start;return{x,i}});
    const hgt=Math.max(1,L.length)*22+4;
    h+=`<div class="trow"><div class="lab">${esc(r.name)}<small>${esc(r.sub||'')}</small></div><div class="trk" style="--n:${N};height:${hgt}px">`;
    if(today>=0&&today<N)h+=`<div class="now" style="left:${today/N*100}%"></div>`;
    ln.forEach(({x,i})=>{const a=Math.max(0,idx(x.start)),b=Math.min(N-1,idx(x.end||x.start)),bad=r.id&&hasClash(x,r.id);
      h+=`<div class="tb ${bad?'x':''}" title="${esc(x.title)}" style="left:${a/N*100}%;width:${(b-a+1)/N*100}%;top:${i*22+2}px;background:${TYPES[x.type][1]}" onclick="edit('${x.id}')">${bad?'⚠️ ':''}${esc(x.title)}</div>`});
    h+='</div></div>';
  });
  if(!S.team.length)h+='<div class="trow"><div class="lab"></div><div class="trk" style="padding:8px"><span class="mu">Añade personal en la pestaña Equipo para ver una fila por persona.</span></div></div>';
  return h+'</div></div><p class="mu">Cada fila es una persona. Toca una barra para editarla; el borde rojo indica solapamiento. La línea azul marca hoy.</p>';
}
function week(){
  const s=monday(cur),today=iso(new Date());
  let h=nav(fmt(s,{day:'numeric',month:'short'})+' – '+fmt(add(s,6),{day:'numeric',month:'short',year:'numeric'}))+'<div class="week">';
  for(let i=0;i<7;i++){
    const d=add(s,i),k=iso(d);
    h+=`<div class="day ${k===today?'today':''}"><h3>${fmt(d,{weekday:'long',day:'numeric'})}</h3>`;
    onDay(k).forEach(e=>h+=`<div class="ev" style="border-color:${TYPES[e.type][1]}" onclick="edit('${e.id}')"><b>${B.has(e.id)?'⚠️ ':''}${esc(e.title)}</b><small>${TYPES[e.type][0]}${e.time?' · '+tm(e):''}</small>${people(e)}</div>`);
    h+=`<button onclick="edit(null,'${k}')">+ Añadir</button></div>`;
  }
  return h+'</div>';
}
function team(){return teamCard()+presetCard()}
function presetCard(){
  return `<div class="card" style="margin-top:12px"><b>Títulos predeterminados</b><div class="pre" style="max-height:none">${S.presets.map((t,i)=>`<span class="pb" style="border:1px solid var(--bd)">${esc(t)} <a onclick="delPre(${i})" style="cursor:pointer;color:#d33">×</a></span>`).join('')}</div><div class="row"><input id="npre" placeholder="Nuevo título" onkeydown="if(event.key==='Enter')addPre()"><button class="pri" onclick="addPre()">Añadir</button></div></div>`;
}
function addPre(){const t=$('#npre').value.trim().toUpperCase();if(!t||S.presets.includes(t))return;S.presets.push(t);save();render()}
function delPre(i){S.presets.splice(i,1);save();render()}
function teamCard(){
  let h='<div class="card"><b>Personal del equipo</b>';
  if(!S.team.length)h+='<p class="mu">Añade a las personas de tu equipo para poder asignarlas a las actividades.</p>';
  S.team.forEach(p=>h+=`<div class="row"><span class="dot" style="background:${p.color}"></span><span style="flex:1">${esc(p.name)}</span><input class="rin" value="${esc(p.role||'')}" placeholder="Rol / función" onchange="setRole('${p.id}',this.value)"><button class="del" onclick="delP('${p.id}')">Quitar</button></div>`);
  return h+`<div class="row"><input id="np" placeholder="Nombre"><input id="nr" class="rin" placeholder="Rol / función" onkeydown="if(event.key==='Enter')addP()"><button class="pri" onclick="addP()">Añadir</button></div></div>`;
}
function addP(){
  const n=$('#np').value.trim();if(!n)return;
  S.team.push({id:uid(),name:n,role:$('#nr').value.trim(),color:COL[S.team.length%COL.length]});save();render();
}
function setRole(id,v){const p=person(id);if(p){p.role=v.trim();save()}}
function delP(id){
  if(!confirm('¿Quitar a esta persona? También se quitará de las actividades.'))return;
  S.team=S.team.filter(p=>p.id!==id);S.events.forEach(e=>e.people=(e.people||[]).filter(x=>x!==id));save();render();
}
function edit(id,day){
  const e=id?S.events.find(x=>x.id===id):{type:'actividad',start:day,end:day,time:'',title:'',notes:'',people:[]};
  $('#dlg').innerHTML=`<label>Título</label><input id="f_t" value="${esc(e.title)}" placeholder="Escribe o elige uno de abajo"><div class="pre">${S.presets.map(t=>`<button type="button" class="pb" data-v="${esc(t)}" onclick="$('#f_t').value=this.dataset.v">${esc(t)}</button>`).join('')}</div>
  <label>Tipo</label><select id="f_ty"><optgroup label="Planificación">${['evento','viaje','actividad'].map(k=>optT(k,e.type)).join('')}</optgroup><optgroup label="Día completo">${OFF.map(k=>optT(k,e.type)).join('')}</optgroup></select>
  <div class="g2"><div><label>Desde</label><input id="f_s" type="date" value="${e.start}"></div>
  <div><label>Hasta</label><input id="f_e" type="date" value="${e.end||e.start}"></div>
  <div><label>Hora inicio (opcional)</label><input id="f_h" type="time" value="${e.time||''}"></div>
  <div><label>Hora fin (opcional)</label><input id="f_h2" type="time" value="${e.time2||''}"></div></div>
  <label>Quién participa <span class="mu">(festivo, libre y vacaciones: sin marcar = todo el equipo)</span></label><div class="chk">${S.team.length?S.team.map(p=>`<label><input type="checkbox" value="${p.id}" ${(e.people||[]).includes(p.id)?'checked':''}>${esc(p.name)}${p.role?' · '+esc(p.role):''}</label>`).join(''):'<span class="mu">Añade personal en la pestaña Equipo.</span>'}</div>
  <label>Notas</label><textarea id="f_n" rows="3">${esc(e.notes)}</textarea>
  <div class="act"><span>${id?'<button class="del" onclick="del(\''+id+'\')">Eliminar</button>':''}</span><span><button onclick="$('#dlg').close()">Cancelar</button> <button class="pri" onclick="saveEv('${id||''}')">Guardar</button></span></div>`;
  $('#dlg').showModal();
}
function saveEv(id){
  const ty=$('#f_ty').value,t=$('#f_t').value.trim()||(OFF.includes(ty)?TYPES[ty][0]:''),s=$('#f_s').value;if(!t||!s){$('#f_t').focus();return}
  let en=$('#f_e').value||s;if(en<s)en=s;
  const o={id:id||uid(),title:t,type:ty,time:OFF.includes(ty)?'':$('#f_h').value,time2:!OFF.includes(ty)&&$('#f_h').value?$('#f_h2').value:'',start:s,end:en,notes:$('#f_n').value,
    people:[...document.querySelectorAll('#dlg .chk input:checked')].map(i=>i.value)};
  const c=clashes(o);
  if(c.length&&!confirm('⚠️ Solapamiento:\n'+c.map(x=>`• ${x.p.name} ya está en «${x.o.title}» (${x.o.start})`).join('\n')+'\n\n¿Guardar igualmente?'))return;
  if(id)S.events[S.events.findIndex(x=>x.id===id)]=o;else S.events.push(o);
  $('#dlg').close();save();render();
}
function del(id){if(!confirm('¿Eliminar?'))return;S.events=S.events.filter(x=>x.id!==id);$('#dlg').close();save();render()}
init();
</script></body></html>
